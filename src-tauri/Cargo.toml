[package]
name = "corpusbot"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "corpusbot"

[lib]
name = "corpusbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
corpusbot-core.workspace = true
corpusbot-agent.workspace = true
corpusbot-ingest.workspace = true
corpusbot-lint.workspace = true
corpusbot-search.workspace = true
corpusbot-store.workspace = true
serde.workspace = true
async-trait.workspace = true
tempfile.workspace = true
tokio.workspace = true
axum = "0.8"
walkdir.workspace = true
serde_json.workspace = true
time.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid.workspace = true

[[bin]]
name = "corpusbot-server"
path = "src/bin/local_server.rs"

[lints]
workspace = true
